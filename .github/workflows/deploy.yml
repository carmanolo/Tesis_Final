name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del Backend
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          npm install

      - name: Instalar dependencias del Frontend
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          npm install

      - name: Inyectar variables de entorno Backend
        run: |
          cp ~/backend.env ./backend/src/config/.env
          cp ~/backend.env ./backend/dist/config/.env

      - name: Inyectar variables de entorno Frontend
        run: cp ~/frontend.env ./frontend/.env

      - name: Reiniciar Backend con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          setsid npm run build && npm start ./dist/index.js
          pm2 save

      - name: Reiniciar Frontend con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          npm run build
          setsid pm2 start npm -- run preview
