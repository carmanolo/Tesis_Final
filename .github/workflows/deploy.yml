name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del Backend
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          npm install

      - name: Instalar dependencias del Frontend
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          npm install

      - name: Inyectar variables de entorno Backend
        run: cp ~/backend.env ./backend/src/config/.env

      - name: Inyectar variables de entorno Frontend
        run: cp ~/frontend.env ./frontend/.env

      - name: Reiniciar Backend con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          setsid pm2 restart api-backend || setsid pm2 start $GITHUB_WORKSPACE/backend/src/index.ts --name "api-backend"
          pm2 save

      - name: Reiniciar Frontend con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          npm run build
          setsid pm2 start npm -- run preview
