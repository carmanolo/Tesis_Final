name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Rescatar uploads existentes
        run: |
          mkdir -p "$HOME/uploads_persistentes"
          if [ -d "$GITHUB_WORKSPACE/backend/uploads" ] && [ ! -L "$GITHUB_WORKSPACE/backend/uploads" ]; then
            cp -a "$GITHUB_WORKSPACE/backend/uploads/." "$HOME/uploads_persistentes/"
          fi
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del Backend
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          npm install

      - name: Instalar dependencias del Frontend
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          npm install

      - name: Inyectar variables de entorno Backend
        run: cp ~/backend.env ./backend/src/config/.env

      - name: Inyectar variables de entorno Frontend
        run: cp ~/frontend.env ./frontend/.env

      - name: Enlazar carpeta persistente de uploads
        run: |
          mkdir -p "$HOME/uploads_persistentes/publicaciones"
          rm -rf ./backend/uploads
          ln -sfn "$HOME/uploads_persistentes" ./backend/uploads

      - name: Detener servidor antiguo
        run: |
          source ~/.nvm/nvm.sh
          pm2 del all

      - name: Reiniciar Backend con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          npm run build
          cp ./src/config/.env ./dist/config/.env -p
          setsid pm2 start ./dist/index.js && setsid pm2 save

      - name: Reiniciar Frontend con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          rm cypress -r
          npm run build
          setsid pm2 start npm --name "frontend" -f -- run preview
